apiVersion: apps/v1

kind: Deployment

metadata:
  name: nginx-deployment
  namespace: dev
  annotations:
    team: devops
    cost: canada_team
    handled_by: US

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "1Gi"

          volumeMounts:
            - name: hostpath-volume
              mountPath: /data

      volumes:
        - name: hostpath-volume
          hostPath:
            path: /data
            type: DirectoryOrCreate